[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# mise [alias] only maps tool names; build/test/lint/fmt are tasks.
[alias]
task = "go-task"

[tasks.build]
run = "cargo build --release"
dir = "{{config_root}}"

[tasks.test]
run = "cargo test"
dir = "{{config_root}}"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."
dir = "{{config_root}}"

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
dir = "{{config_root}}"
